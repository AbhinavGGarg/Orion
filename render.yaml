# Render Blueprint — deploys the Polaris backend as a Docker web service on the
# FREE tier (no cost). The frontend deploys separately on Vercel and points at
# this service via BACKEND_API_URL (see README "Deploy"). A hosted backend has
# no local Ollama, so it uses an OpenAI-compatible provider; self-hosting still
# defaults to Ollama.
services:
  - type: web
    name: orion-backend      # keep: renaming a blueprint service makes Render create a new one
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    plan: free               # $0. Trade-offs: 512MB RAM, sleeps after ~15min idle (slow first request).
    healthCheckPath: /hello
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: openai        # OpenAI-compatible endpoint (no local Ollama in the cloud)
      - key: OPENAI_API_KEY
        sync: false          # set in the Render dashboard — never commit a key
      - key: OPENAI_MODEL
        sync: false          # e.g. a Featherless-hosted open model id, or your own GPU box endpoint
      - key: CORS_ALLOW_ORIGINS
        sync: false          # set to your Vercel frontend origin if calling the API directly
      - key: REPO_CLONE_ROOT
        value: /tmp/polaris/repos   # ephemeral scratch — clones are per-scan and disposable
      - key: ENFORCE_TARGET_ALLOWLIST
        value: "true"        # hosted instance: only scan sanctioned demo targets
      - key: ALLOWED_TARGETS
        value: example.com,scanme.nmap.org,testphp.vulnweb.com
